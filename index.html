<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)"/>
<script>
/* Applies the stored theme (bc-theme: light | dark, absent = system) before first paint. */
(function(){try{var t=localStorage.getItem('bc-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);var m=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<m.length;i++)m[i].setAttribute('content',t==='dark'?'#121211':'#fbfaf6');}}catch(e){}})();
</script>
<meta name="description" content="Les ventes, les clients et leur fidélité dans un commerce en ligne britannique, de décembre 2010 à décembre 2011, à partir du jeu public UCI Online Retail."/>
<title>RetailScope · ventes et fidélisation, UCI Online Retail</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
